<script>
document.addEventListener('DOMContentLoaded', function(){
  const D=JSON.parse(document.getElementById('graph-data').textContent);
  const CN={C:'Core',A:'Animal husbandry',E:'Environmental impacts',B:'Business',L:'Law',P:'Politics',S:'Societal impacts'};
  const CV={C:'--viz-accent',A:'--viz-series-1',E:'--viz-series-2',B:'--viz-series-3',L:'--viz-series-4',P:'--viz-series-5',S:'--viz-series-6'};
  const N=Object.fromEntries(D.n.map(x=>[x[0],{label:x[1],cat:x[2]}]));
  const S=Object.fromEntries(D.s);
  const q=document.getElementById('q'),c=document.getElementById('c'),t=document.getElementById('t'),d=document.getElementById('d'),lst=document.getElementById('lst'),st=document.getElementById('st'),fs=document.getElementById('fs'),leg=document.getElementById('leg');
  const svg=document.getElementById('g'),zin=document.getElementById('zin'),zout=document.getElementById('zout'),zfit=document.getElementById('zfit'),zoomreadout=document.getElementById('zoomreadout');
  const baseView={x:0,y:0,w:1200,h:760};
  let view={...baseView};
  let sn='',se='';
  [...new Set(D.n.map(x=>x[2]))].sort().forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=CN[k];c.appendChild(o)});
  [...new Set(D.e.map(x=>x[4]))].sort().forEach(k=>{const o=document.createElement('option');o.value=o.textContent=k;t.appendChild(o)});
  leg.innerHTML=Object.keys(CN).map(k=>`<span class="viz-badge" style="background:var(${CV[k]})">${CN[k]}</span>`).join('');

  function filtered(){
    const z=q.value.toLowerCase(),cc=c.value,tt=t.value;
    let es=D.e.filter(e=>(!tt||e[4]===tt)&&(!z||`${N[e[1]].label} ${e[2]} ${N[e[3]].label}`.toLowerCase().includes(z)));
    if(sn)es=es.filter(e=>e[1]===sn||e[3]===sn);
    const ids=new Set(es.flatMap(e=>[e[1],e[3]]));
    let ns=D.n.filter(n=>(!cc||n[2]===cc)&&(!z||n[1].toLowerCase().includes(z)||ids.has(n[0])));
    if(cc){const a=new Set(ns.map(n=>n[0]));es=es.filter(e=>a.has(e[1])||a.has(e[3]));es.forEach(e=>{a.add(e[1]);a.add(e[3])});ns=D.n.filter(n=>a.has(n[0]))}
    return{ns,es};
  }
  function render(){
    const f=filtered(),vis=new Set(f.ns.map(n=>n[0])),edgeIds=new Set(f.es.map(e=>e[0]));
    document.querySelectorAll('.N').forEach(x=>x.classList.toggle('off',!vis.has(x.dataset.node)));
    document.querySelectorAll('.E').forEach(x=>{x.style.display=edgeIds.has(x.dataset.edge)?'':'none';x.classList.toggle('on',se===x.dataset.edge)});
    document.querySelectorAll('.N').forEach(x=>x.classList.toggle('on',sn===x.dataset.node));
    st.textContent=`${f.ns.length} concepts and ${f.es.length} dependencies visible`; list(f.es);
  }
  function src(a){return a.map(x=>`<div class="source"><strong>${S[x]||x}</strong><small>Source ${x}</small></div>`).join('')}
  function node(id){
    sn=sn===id?'':id;se='';
    if(!sn)d.innerHTML='<h2>Explore the graph</h2><p class="help">Search or click a concept.</p>';
    else{const es=D.e.filter(e=>e[1]===id||e[3]===id),ss=[...new Set(es.flatMap(e=>e[5]))];d.innerHTML=`<h2>${N[id].label}</h2><span class="viz-badge" style="margin-top:8px;background:var(${CV[N[id].cat]})">${CN[N[id].cat]}</span><p>${es.length} direct dependencies supported by ${ss.length} source records.</p>${src(ss)}`}
    render();
  }
  function edge(id){
    se=id;sn='';const e=D.e.find(x=>x[0]===id);
    d.innerHTML=`<h2>Dependency ${e[0]}</h2><div style="margin-top:12px"><div class="viz-node">${N[e[1]].label}</div><div style="text-align:center;margin:9px 0"><span class="viz-edge-label">${e[2]}</span></div><div class="viz-node">${N[e[3]].label}</div></div><h3 style="margin-top:14px">Supporting sources</h3>${src(e[5])}`;
    render();
  }
  function list(es){
    lst.innerHTML=es.slice(0,10).map(e=>`<button type="button" class="edge-btn" data-i="${e[0]}"><strong>${N[e[1]].label}</strong><span>${e[2]} → ${N[e[3]].label}</span></button>`).join('')+(es.length>10?`<p class="help">Showing 10 of ${es.length}. Narrow the filters to see more.</p>`:'');
    lst.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>edge(b.dataset.i)));
  }
  document.querySelectorAll('.N').forEach(x=>x.addEventListener('click',()=>node(x.dataset.node)));
  document.querySelectorAll('.E').forEach(x=>x.addEventListener('click',()=>edge(x.dataset.edge)));
  [q,c,t].forEach(x=>x.addEventListener(x===q?'input':'change',()=>{sn='';se='';render()}));
  document.getElementById('r').addEventListener('click',()=>{q.value='';c.value='';t.value='';sn='';se='';d.innerHTML='<h2>Explore the graph</h2><p class="help">Search or click a concept.</p>';render()});
  fs.addEventListener('click',async()=>{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()});
  document.addEventListener('fullscreenchange',()=>fs.textContent=document.fullscreenElement?'Exit full screen':'Full screen');
  render();
});
